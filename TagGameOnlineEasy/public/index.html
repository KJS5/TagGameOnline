<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tag Game Online Easy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu" class="panel">
    <h1>Tag Game</h1>

    <input id="name" placeholder="Your name" maxlength="12" />

    <button id="create">Create Room</button>

    <div class="joinLine">
      <input id="code" placeholder="Room code" maxlength="4" />
      <button id="join">Join</button>
    </div>

    <p id="err"></p>

    <p class="menuHelp">
      Make a room, send the code to friends, then press Start.
    </p>
  </div>

  <div id="game" class="hidden">
    <div class="top">
      <div>
        Room:
        <b id="roomCode">----</b>
      </div>

      <div>
        You are:
        <b id="you">P?</b>
      </div>

      <div>
        Time:
        <b id="time">120</b>
      </div>

      <button id="copy">Copy Link</button>
      <button id="start">Start</button>
      <button id="restart">Restart</button>
    </div>

    <canvas id="c" width="1400" height="750"></canvas>

    <div class="mobileControls">
      <button id="leftBtn" aria-label="Move left">◀</button>
      <button id="jumpBtn" class="jump" aria-label="Jump">▲</button>
      <button id="rightBtn" aria-label="Move right">▶</button>
    </div>

    <p class="help">
      Keyboard: A/D or Arrow Keys to move — W/Space/Up to jump. Tablet: use arrows.
    </p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
